name: macOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test src/domain
      - name: Package Diodati.app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: bun run package:mac
      - name: Check the app name
        run: bash scripts/check-mac-app.sh adhoc
      - uses: actions/upload-artifact@v4
        with:
          name: Diodati-macOS
          path: release/Diodati-macOS.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test src/domain
      - name: Package and notarize Diodati.app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CSC_LINK:-}" ] || missing="${missing} CSC_LINK"
          [ -n "${CSC_KEY_PASSWORD:-}" ] || missing="${missing} CSC_KEY_PASSWORD"
          [ -n "${APPLE_ID:-}" ] || missing="${missing} APPLE_ID"
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || missing="${missing} APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "${APPLE_TEAM_ID:-}" ] || missing="${missing} APPLE_TEAM_ID"
          if [ -n "${missing}" ]; then
            echo "missing secrets:${missing}"
            exit 1
          fi
          bun run package:mac:signed
      - name: Check the app name
        run: bash scripts/check-mac-app.sh signed
      - uses: actions/upload-artifact@v4
        with:
          name: Diodati-macOS
          path: release/Diodati-macOS.zip
          if-no-files-found: error
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos
          name: Diodati for macOS
          make_latest: true
          files: release/Diodati-macOS.zip
          body: Apple Silicon build. Signed with Developer ID and notarized by Apple.
